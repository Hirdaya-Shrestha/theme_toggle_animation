name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Get example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run example tests
        working-directory: example
        run: flutter test